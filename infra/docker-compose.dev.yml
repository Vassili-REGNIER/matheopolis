services:
  mysql:
    image: mysql:8.4
    container_name: matheopolis-mysql
    profiles:
      - local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-matheopolis}"
      MYSQL_USER: "${DB_USER:-matheopolis}"
      MYSQL_PASSWORD: "${DB_PASS:-matheopolis}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/database/seeds/content/scenario.sql:/docker-entrypoint-initdb.d/02-content-scenario.sql:ro
      - ../backend/database/seeds/demo/users.sql:/docker-entrypoint-initdb.d/03-demo-users.sql:ro
      - ../backend/database/seeds/content/quiz-laurence.sql:/docker-entrypoint-initdb.d/04-content-quiz-laurence.sql:ro
      - ../backend/database/seeds/demo/quizzes.sql:/docker-entrypoint-initdb.d/05-demo-quizzes.sql:ro
      - ../backend/database/seeds/demo/progressions.sql:/docker-entrypoint-initdb.d/06-demo-progressions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: matheopolis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_MAINTENANCE: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_PATH: /
      APP_FRONTEND_ORIGIN: "${APP_FRONTEND_ORIGIN:-http://localhost:5173}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      USER_COOKIE: user_id
      USER_FLASH_KEY: flash_messages
      USER_CSRF_KEY: csrf_token
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-1800}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      MAIL_SMTP_HOST: "${MAIL_SMTP_HOST:-}"
      MAIL_SMTP_PORT: "${MAIL_SMTP_PORT:-587}"
      MAIL_SMTP_USER: "${MAIL_SMTP_USER:-}"
      MAIL_SMTP_PASS: "${MAIL_SMTP_PASS:-}"
      MAIL_SMTP_ENCRYPTION: "${MAIL_SMTP_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@matheopolis.local}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Matheopolis}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/var/www/html
      - ../.env:/var/www/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/api/health')===false?1:0);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    container_name: matheopolis-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  frontend:
    image: node:22-alpine
    container_name: matheopolis-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  mysql_data:
  frontend_node_modules:
