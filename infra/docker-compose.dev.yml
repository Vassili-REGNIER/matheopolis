services:
  mysql:
    image: mysql:8.4
    container_name: matheopolis-mysql
    profiles:
      - local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-matheopolis}"
      MYSQL_USER: "${DB_USER:-matheopolis}"
      MYSQL_PASSWORD: "${DB_PASS:-matheopolis}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: matheopolis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_MAINTENANCE: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_PATH: /
      APP_FRONTEND_ORIGIN: "${APP_FRONTEND_ORIGIN:-http://localhost:5173}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      USER_COOKIE: user_id
      USER_FLASH_KEY: flash_messages
      USER_CSRF_KEY: csrf_token
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-1800}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      PLAY_TOKEN_SECRET: "${PLAY_TOKEN_SECRET}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/api/health')===false?1:0);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: matheopolis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
