services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: matheopolis-backend-prod
    restart: always
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_MAINTENANCE: "false"
      APP_URL: "${APP_URL}"
      APP_PATH: /
      APP_FRONTEND_ORIGIN: "${APP_FRONTEND_ORIGIN}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      USER_COOKIE: user_id
      USER_FLASH_KEY: flash_messages
      USER_CSRF_KEY: csrf_token
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-1800}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      PLAY_TOKEN_SECRET: "${PLAY_TOKEN_SECRET}"
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: matheopolis-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PUBLIC_PORT:-80}:80"

  mysql:
    image: mysql:8.4
    container_name: matheopolis-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ../backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    profiles:
      - with-local-mysql

volumes:
  mysql_prod_data:
