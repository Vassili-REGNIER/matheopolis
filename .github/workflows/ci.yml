name: CI

on:
  # Run on every branch push so feature branches get the same checks before merge.
  push:
  pull_request:
    branches: [ "main", "master" ]

# Shared PHPUnit / API-server environment (flat vars for PHP built-in server).
x-test-runtime-env: &test-runtime-env
  APP_ENV: test
  APP_DEBUG: true
  APP_URL: http://127.0.0.1:8080
  APP_PATH: /
  APP_FRONTEND_ORIGIN: http://127.0.0.1:5173
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASS: root
  DB_NAME: matheopolis_test
  USER_COOKIE: user_id
  USER_FLASH_KEY: flash_messages
  USER_CSRF_KEY: csrf_token
  SESSION_IDLE_TIMEOUT: 1800
  SESSION_COOKIE_SAMESITE: Lax
  TEST_API_BASE_URL: http://127.0.0.1:8080

jobs:
  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  backend-composer-validate:
    name: Backend composer validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Composer validate
        working-directory: backend
        run: composer validate --strict

  backend-composer-audit:
    name: Backend composer audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Composer audit
        working-directory: backend
        run: composer audit

  backend-php-lint:
    name: Backend PHP lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax lint
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l

  backend-cs-check:
    name: Backend code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        working-directory: backend
        run: composer cs:check

  backend-static-analysis:
    name: Backend static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Static analysis
        working-directory: backend
        run: composer stan

  backend-architecture-check:
    name: Backend architecture check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Architecture check
        working-directory: backend
        run: composer arch:check

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: matheopolis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, xml, xmlwriter, zip, pdo_mysql, curl
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Configure test environment
        run: |
          {
            echo 'TEST_APP_ENV=test'
            echo 'TEST_APP_DEBUG=true'
            echo 'TEST_APP_URL=http://127.0.0.1:8080'
            echo 'TEST_APP_PATH=/'
            echo 'TEST_APP_FRONTEND_ORIGIN=http://127.0.0.1:5173'
            echo 'TEST_DB_HOST=127.0.0.1'
            echo 'TEST_DB_PORT=3306'
            echo 'TEST_DB_USER=root'
            echo 'TEST_DB_PASS=root'
            echo 'TEST_DB_NAME=matheopolis_test'
            echo 'TEST_API_BASE_URL=http://127.0.0.1:8080'
            echo 'TEST_USER_COOKIE=user_id'
            echo 'TEST_USER_FLASH_KEY=flash_messages'
            echo 'TEST_USER_CSRF_KEY=csrf_token'
            echo 'TEST_SESSION_IDLE_TIMEOUT=1800'
            echo 'TEST_SESSION_COOKIE_SAMESITE=Lax'
          } > .env

      - name: Start API server for HTTP tests
        working-directory: backend
        env: *test-runtime-env
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/matheopolis-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start"
          curl -s http://127.0.0.1:8080/api/health || true
          cat /tmp/matheopolis-api.log
          exit 1

      - name: Run tests
        working-directory: backend
        env: *test-runtime-env
        run: composer test

  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: matheopolis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, xml, xmlwriter, zip, pdo_mysql, curl
          tools: composer:v2
          coverage: xdebug

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Configure test environment
        run: |
          {
            echo 'TEST_APP_ENV=test'
            echo 'TEST_APP_DEBUG=true'
            echo 'TEST_APP_URL=http://127.0.0.1:8080'
            echo 'TEST_APP_PATH=/'
            echo 'TEST_APP_FRONTEND_ORIGIN=http://127.0.0.1:5173'
            echo 'TEST_DB_HOST=127.0.0.1'
            echo 'TEST_DB_PORT=3306'
            echo 'TEST_DB_USER=root'
            echo 'TEST_DB_PASS=root'
            echo 'TEST_DB_NAME=matheopolis_test'
            echo 'TEST_API_BASE_URL=http://127.0.0.1:8080'
            echo 'TEST_USER_COOKIE=user_id'
            echo 'TEST_USER_FLASH_KEY=flash_messages'
            echo 'TEST_USER_CSRF_KEY=csrf_token'
            echo 'TEST_SESSION_IDLE_TIMEOUT=1800'
            echo 'TEST_SESSION_COOKIE_SAMESITE=Lax'
          } > .env

      - name: Start API server for HTTP tests
        working-directory: backend
        env: *test-runtime-env
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/matheopolis-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start"
          curl -s http://127.0.0.1:8080/api/health || true
          cat /tmp/matheopolis-api.log
          exit 1

      - name: Generate coverage (minimum 70% lines)
        working-directory: backend
        env: *test-runtime-env
        run: composer test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: backend/build/coverage/clover.xml

  frontend-type-check:
    name: Frontend type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript check
        working-directory: frontend
        run: npm run check