name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Composer validate
        run: composer validate --strict

      - name: Composer audit
        run: composer audit

      - name: PHP syntax lint
        run: git ls-files '*.php' | xargs -n1 php -l

      - name: Check Code Style
        run: composer cs:check

      - name: Static Analysis
        run: composer stan

      - name: Architecture check (optional)
        run: composer arch:check

      - name: Run tests
        run: composer test

      - name: Generate coverage
        run: composer test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/coverage/clover.xml