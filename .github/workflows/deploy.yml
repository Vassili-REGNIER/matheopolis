name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Alwaysdata
    # Secrets stored under Settings → Environments → matheopolis_prod are only
    # exposed to jobs that declare this environment (repository secrets work without it).
    environment: matheopolis_prod
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deploy secrets
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_ENV_FILE: ${{ secrets.ALWAYSDATA_ENV_FILE }}
        run: |
          missing=0
          for name in ALWAYSDATA_HOST ALWAYSDATA_USER ALWAYSDATA_TARGET ALWAYSDATA_SSH_KEY ALWAYSDATA_ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets either as repository secrets (Settings → Secrets → Actions)"
            echo "or as environment secrets for 'matheopolis_prod' (Settings → Environments)."
            exit 1
          fi
          if [[ "${ALWAYSDATA_HOST}" == *"@"* ]]; then
            echo "::error::ALWAYSDATA_HOST must be the SSH hostname only (example: ssh-matheopolis.alwaysdata.net), not user@host."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install production dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Prepare remote .env
        env:
          ALWAYSDATA_ENV_FILE: ${{ secrets.ALWAYSDATA_ENV_FILE }}
        run: |
          {
            echo "APP_ENV=prod"
            printf '%s\n' "${ALWAYSDATA_ENV_FILE}" | grep -v -E '^(APP_ENV|TEST_APP_ENV|DEV_APP_ENV|PROD_APP_ENV)='
          } > deploy.env

      - name: Add deploy key
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Write the key verbatim (printf can corrupt multiline OpenSSH keys).
          echo "${ALWAYSDATA_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add known_hosts
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
        run: |
          if ! ssh-keyscan -T 10 -H "${ALWAYSDATA_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
            echo "::error::ssh-keyscan failed for host '${ALWAYSDATA_HOST}'."
            cat ssh-keyscan.err
            exit 1
          fi

      - name: Test SSH connection
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
        run: |
          SSH_OPTS=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes)
          if ! ssh "${SSH_OPTS[@]}" "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}" \
            "mkdir -p '${ALWAYSDATA_TARGET}/backend' '${ALWAYSDATA_TARGET}/frontend' && echo 'SSH OK'"; then
            echo "::error::SSH authentication failed."
            echo "Generate a deploy key pair locally, add the PUBLIC key in AlwaysData"
            echo "(Remote access → SSH/SFTP → authorized keys for user ${ALWAYSDATA_USER}),"
            echo "then store the PRIVATE key in ALWAYSDATA_SSH_KEY."
            echo "Do not reuse the server's ~/.ssh/id_ed25519 — that key is for outbound connections."
            exit 1
          fi

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Sync files with rsync
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
        run: |
          RSYNC_RSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
          REMOTE="${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}:${ALWAYSDATA_TARGET}"
          rsync -az --mkpath -e "${RSYNC_RSH}" deploy.env "${REMOTE}/.env"
          rsync -az --delete --mkpath -e "${RSYNC_RSH}" --exclude-from="backend/.rsyncignore" \
            ./backend/ "${REMOTE}/backend/"
          rsync -az --delete --mkpath -e "${RSYNC_RSH}" --exclude-from="frontend/.rsyncignore" \
            ./frontend/ "${REMOTE}/frontend/"

      - name: Install dependencies on server
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}" \
            "chmod 600 '${ALWAYSDATA_TARGET}/.env' && cd '${ALWAYSDATA_TARGET}/backend' && composer install --no-dev --optimize-autoloader --prefer-dist --no-progress"
