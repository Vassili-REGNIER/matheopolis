name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Alwaysdata
    # Secrets stored under Settings → Environments → matheopolis_prod are only
    # exposed to jobs that declare this environment (repository secrets work without it).
    environment: matheopolis_prod
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deploy secrets
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_ENV_FILE: ${{ secrets.ALWAYSDATA_ENV_FILE }}
        run: |
          missing=0
          for name in ALWAYSDATA_HOST ALWAYSDATA_USER ALWAYSDATA_TARGET ALWAYSDATA_SSH_KEY ALWAYSDATA_ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets either as repository secrets (Settings → Secrets → Actions)"
            echo "or as environment secrets for 'matheopolis_prod' (Settings → Environments)."
            exit 1
          fi
          if [[ "${ALWAYSDATA_HOST}" == *"@"* ]]; then
            echo "::error::ALWAYSDATA_HOST must be the SSH hostname only (example: ssh-matheopolis.alwaysdata.net), not user@host."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install production dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Prepare remote .env
        env:
          ALWAYSDATA_ENV_FILE: ${{ secrets.ALWAYSDATA_ENV_FILE }}
        run: |
          {
            echo "APP_ENV=prod"
            printf '%s\n' "${ALWAYSDATA_ENV_FILE}" | grep -v -E '^(APP_ENV|TEST_APP_ENV|DEV_APP_ENV|PROD_APP_ENV)='
          } > deploy.env

      - name: Add deploy key
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${ALWAYSDATA_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add known_hosts
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
        run: |
          if ! ssh-keyscan -T 10 -H "${ALWAYSDATA_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
            echo "::error::ssh-keyscan failed for host '${ALWAYSDATA_HOST}'."
            cat ssh-keyscan.err
            exit 1
          fi

      - name: Sync files with rsync
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
        run: |
          rsync -az deploy.env \
            "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}:${ALWAYSDATA_TARGET}/.env"
          rsync -az --delete --exclude-from="backend/.rsyncignore" \
            ./backend/ "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}:${ALWAYSDATA_TARGET}/backend/"
          rsync -az --delete \
            ./frontend/ "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}:${ALWAYSDATA_TARGET}/frontend/"

      - name: Install dependencies on server
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_TARGET: ${{ secrets.ALWAYSDATA_TARGET }}
        run: |
          ssh "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}" \
            "chmod 600 '${ALWAYSDATA_TARGET}/.env' && cd '${ALWAYSDATA_TARGET}/backend' && composer install --no-dev --optimize-autoloader --prefer-dist --no-progress"
