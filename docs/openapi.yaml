openapi: 3.0.3
info:
  title: Matheopolis API
  version: "1.2.0"
  description: |
    API contract for Matheopolis backend/frontend interactions.
    Authentication is session-based via cookie.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Classes
  - name: Riddles
  - name: Quizzes
paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseEnvelope"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or username
      description: Issues a session cookie and a session-bound CSRF token. Exempt from CSRF (pre-authentication).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      description: Returns the current user and the session-bound CSRF token.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users:
    post:
      tags: [Users]
      summary: Register a generic account
      description: Creates a teacher account for approved academic email domains, otherwise creates a free-user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/users/teachers:
    post:
      tags: [Users]
      summary: Register a teacher account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRequest"
      responses:
        "201":
          description: Teacher account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/users/students:
    post:
      tags: [Users]
      summary: Register a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Student account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user profile by id
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes:
    get:
      tags: [Classes]
      summary: List classes for the authenticated teacher
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Teacher class list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassListResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Classes]
      summary: Create class (teacher only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/classes/{id}:
    get:
      tags: [Classes]
      summary: Get class details
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassDetailResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Classes]
      summary: Update class
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassRequest"
      responses:
        "200":
          description: Class updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Classes]
      summary: Delete or archive class
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Class deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{id}/students:
    get:
      tags: [Classes]
      summary: List students in class
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Students list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{id}/students/progress:
    get:
      tags: [Classes]
      summary: List students with progression summary
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Students progression list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgressListResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/riddles/{riddleId}/start:
    post:
      tags: [Riddles]
      summary: Start riddle progression
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: riddleId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Riddle progression started or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiddleProgressWithTokenEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/puzzles:
    get:
      tags: [Riddles]
      summary: List active riddles
      responses:
        "200":
          description: Riddle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleListResponseEnvelope"

  /api/riddles/{riddleId}/progress:
    get:
      tags: [Riddles]
      summary: Get riddle progression state
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: riddleId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Riddle progression state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiddleProgressEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/riddles/{riddleId}/attempt:
    post:
      tags: [Riddles]
      summary: Submit attempt for riddle
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: riddleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiddleAttemptRequest"
      responses:
        "200":
          description: Attempt processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiddleAttemptResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/riddles/{riddleId}/complete:
    post:
      tags: [Riddles]
      summary: Complete a riddle
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: riddleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiddleCompleteRequest"
      responses:
        "200":
          description: Riddle completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiddleProgressEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/quizzes:
    get:
      tags: [Quizzes]
      summary: List accessible quizzes
      description: Returns quizzes the caller can access, filtered by role.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: publicationRequested
          required: false
          schema:
            type: boolean
          description: Admin-only filter for quizzes awaiting publication (askAdmin = true).
      responses:
        "200":
          description: Accessible quiz list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizListResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Quizzes]
      summary: Create a quiz
      description: Teachers can create private quizzes only; admins can create public or private quizzes.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizRequest"
      responses:
        "201":
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetailResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/quizzes/{id}:
    get:
      tags: [Quizzes]
      summary: Get a quiz to play
      description: Returns quiz info and questions without revealing correct options.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz play view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizPlayResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Quizzes]
      summary: Update a quiz, request publication, or publish
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuizRequest"
      responses:
        "200":
          description: Quiz updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetailResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Quizzes]
      summary: Delete a quiz
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Quiz deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/quizzes/{id}/progress:
    get:
      tags: [Quizzes]
      summary: Get the caller's quiz progression
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz progression state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizProgressEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/quizzes/{id}/attempts:
    post:
      tags: [Quizzes]
      summary: Start a new quiz attempt
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizProgressEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/quizzes/{id}/responses:
    post:
      tags: [Quizzes]
      summary: Submit an answer to one question
      description: Auto-starts an attempt if none is in progress and advances to the next question.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuizResponseRequest"
      responses:
        "200":
          description: Answer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizProgressEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/quizzes/{id}/correction:
    get:
      tags: [Quizzes]
      summary: Get the correction for a completed attempt
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: attempt
          required: false
          schema:
            type: integer
          description: Target a specific completed attempt (defaults to the latest completed one).
      responses:
        "200":
          description: Quiz correction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCorrectionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/quizzes/{id}/questions:
    post:
      tags: [Quizzes]
      summary: Add a question to a quiz
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizQuestionRequest"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestionResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/quizzes/{id}/questions/{questionId}:
    patch:
      tags: [Quizzes]
      summary: Update a quiz question
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuizQuestionRequest"
      responses:
        "200":
          description: Question updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestionResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Quizzes]
      summary: Delete a quiz question
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Question deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/quizzes/{id}/target-classes:
    get:
      tags: [Quizzes]
      summary: List class-access overrides for a quiz
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Override list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizTargetClassListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/quizzes/{id}/target-classes/{classId}:
    put:
      tags: [Quizzes]
      summary: Set the access override for a (quiz, class) pair
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: classId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQuizTargetClassRequest"
      responses:
        "200":
          description: Override set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizTargetClassEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Quizzes]
      summary: Remove an access override
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: classId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Override removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Access denied for current role/scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: object
          nullable: true
        error:
          $ref: "#/components/schemas/ErrorObject"

    HealthData:
      type: object
      required: [service, status, time]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok]
        time:
          type: string
          format: date-time

    HealthResponseEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/HealthData"
        error:
          type: object
          allOf:
            - $ref: "#/components/schemas/ErrorObject"
          nullable: true

    Role:
      type: string
      enum: [admin, teacher, student, free_user]

    User:
      type: object
